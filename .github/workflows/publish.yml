name: Publish Teaching

on:
  push:
    branches:
      - master

jobs:
  # The suite runs before anything is published, and the image job depends on it: a green
  # pipeline must mean "the exercises are correct AND the page that renders them is
  # correct", not merely "the image built". Four rendering defects once reached the live
  # site through this pipeline — every one of them would have been caught here (TD-077) —
  # and a merge conflict sat unresolved in web/src/config.js and app.js until a human
  # read both versions, which the JavaScript step below now prevents (TD-110).
  test:
    runs-on: ubuntu-latest
    # The interpreter the service itself runs on: a test job on a different Python could
    # pass while production fails, which is the failure mode this job exists to prevent.
    container: python:3.14-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install the libraries the rendering path needs
        # Pango/cairo/gdk-pixbuf are WeasyPrint's dependencies (the PDF renderer);
        # Node runs KaTeX server-side, so screen and PDF share one LaTeX source.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 shared-mime-info \
            nodejs npm
          rm -rf /var/lib/apt/lists/*
          # Debian ships the binary as `nodejs`; the renderer looks for `node` on PATH
          command -v node >/dev/null || ln -s "$(command -v nodejs)" /usr/local/bin/node
          node --version

      - name: Install the Python dependencies
        # Read from pyproject so the workflow and the image cannot drift apart.
        run: |
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -e '.[dev]'

      - name: Install the frontend dependencies
        # KaTeX is the runtime dependency app/render/pdf.py locates at
        # web/node_modules/katex/dist, the same copy the image vendors at /opt/katex.
        # The dev dependencies come too: the suite below needs the runner and the DOM.
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Run the frontend test suite
        # The gate over the renderer itself. `config.js` and `app.js` build the page a
        # classroom reads, and a build check cannot see a behavioural regression in
        # either — a wrong resolution of a merge conflict compiles cleanly. It must fail
        # here, before the image: build-and-push needs this job, so a red suite stops
        # the publish.
        working-directory: web
        run: npm test

      - name: Run the test suite
        run: python -m pytest tests -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: "roberto.tazzoli@gmail.com"
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            tazzo/tazlab-teaching:latest
            tazzo/tazlab-teaching:teaching-${{ github.run_number }}-${{ github.sha }}
