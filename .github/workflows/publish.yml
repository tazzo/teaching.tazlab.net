name: Publish Teaching

on:
  push:
    branches:
      - master

jobs:
  # The suite runs before anything is published, and the image job depends on it: a green
  # pipeline must mean "the exercises are correct AND the page that renders them is
  # correct", not merely "the image built". Four rendering defects once reached the live
  # site through this pipeline — every one of them would have been caught here (TD-077) —
  # and a merge conflict sat unresolved in web/src/config.js and app.js until a human
  # read both versions, which the JavaScript step below now prevents (TD-110).
  test:
    runs-on: ubuntu-latest
    # The interpreter the service itself runs on: a test job on a different Python could
    # pass while production fails, which is the failure mode this job exists to prevent.
    container: python:3.14-slim
    steps:
      # GIT BEFORE THE CHECKOUT, and this order is not cosmetic: every step of a container
      # job — `uses:` steps included — runs INSIDE this image, so when `actions/checkout`
      # finds no git on PATH it falls back to downloading the commit as a tarball: no
      # `.git`, no history, and `fetch-depth: 0` is silently ignored. That is exactly what
      # happened: five runs went red between 2026-11-26 and 2026-11-27 (691b3e4, 5b33224,
      # 8a6d677, f352740, 0d16293) because the sheet's commit could not be named. Git was
      # installed, but in the NEXT step — one step too late, and the failure landed two
      # steps further on, in the suite, as "no commit".
      - name: Install git before the checkout
        # python:3.14-slim ships no git. Nothing here needs the repository: this step only
        # has to make `git` exist so that the checkout below clones instead of downloading.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
          git --version

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # full history: the version of a sheet is the commit that last touched its PDF
          fetch-depth: 0

      - name: The checkout is a repository, not a tarball
        # The guard for the failure above, at the step that would cause it: a tarball
        # checkout looks exactly like a good one until somebody asks git a question.
        run: |
          test -e .git || {
            echo "ERROR: the checkout has no .git — git was missing when actions/checkout ran";
            exit 1; }
          test "$(git rev-parse --is-shallow-repository)" = false || {
            echo "ERROR: the checkout is shallow — the commit that last touched a PDF is not HEAD";
            exit 1; }

      - name: Install the libraries the rendering path needs
        # Pango/cairo/gdk-pixbuf are WeasyPrint's dependencies (the PDF renderer);
        # Node runs KaTeX server-side, so screen and PDF share one LaTeX source.
        # git is not in this list on purpose: it must already exist when the checkout
        # above runs, which is why the first step installs it (see the comment there).
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 shared-mime-info \
            nodejs npm
          rm -rf /var/lib/apt/lists/*
          # Debian ships the binary as `nodejs`; the renderer looks for `node` on PATH
          command -v node >/dev/null || ln -s "$(command -v nodejs)" /usr/local/bin/node
          node --version

      - name: Name the version of every sheet
        # The same step the image job runs, here for the opposite reason: the suite asserts
        # that the page's date and commit really are the ones of the last commit touching
        # each PDF, and a shallow clone would find nothing to compare with. Running it
        # before the tests means a version that cannot be named is a red pipeline, not a
        # page that quietly loses its commit.
        run: python3 scripts/schede_versions.py --require-commit

      - name: Install the Python dependencies
        # Read from pyproject so the workflow and the image cannot drift apart.
        run: |
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -e '.[dev]'

      - name: Install the frontend dependencies
        # KaTeX is the runtime dependency app/render/pdf.py locates at
        # web/node_modules/katex/dist, the same copy the image vendors at /opt/katex.
        # The dev dependencies come too: the suite below needs the runner and the DOM.
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Run the frontend test suite
        # The gate over the renderer itself. `config.js` and `app.js` build the page a
        # classroom reads, and a build check cannot see a behavioural regression in
        # either — a wrong resolution of a merge conflict compiles cleanly. It must fail
        # here, before the image: build-and-push needs this job, so a red suite stops
        # the publish.
        working-directory: web
        run: npm test

      - name: Run the test suite
        run: python -m pytest tests -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The whole history: the version of a sheet is the commit that last changed its
          # PDF, and that commit is usually not HEAD. On a shallow clone the step below
          # would find nothing and the page would publish a sheet with no version.
          fetch-depth: 0

      - name: Name the version of every sheet
        # Writes schede/versions.json (date + commit + sha256 per PDF) into the build
        # context, where the Dockerfile copies it into the image: the running service has
        # no .git, so this is the only place the answer can be found. `--require-commit`
        # makes an unnameable version a red pipeline instead of an image whose page says
        # only "compilata il".
        run: python3 scripts/schede_versions.py --require-commit

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: "roberto.tazzoli@gmail.com"
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            tazzo/tazlab-teaching:latest
            tazzo/tazlab-teaching:teaching-${{ github.run_number }}-${{ github.sha }}
