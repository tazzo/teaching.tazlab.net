[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "teaching-tazlab-net"
version = "0.1.0"
description = "Didactics app served at teaching.tazlab.net: mathematics exercise and physics problem generators."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "sympy==1.14.0",
    "weasyprint==70.0",
    "jinja2==3.1.6",
    "httpx==0.28.1",
]

[tool.setuptools]
# Explicit: flat-layout auto-discovery is a heuristic and would break the image
# build the moment a second top-level directory appears.
packages = ["app", "app.api", "app.core", "app.generators", "app.generators.math"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
